  # Original first (see the header comment): browsers that can play it get it
  # directly with zero transcode; the ffmpeg variant starts lazily only for
  # viewers whose browser cannot play the original codec.
  cam-1:
    - rtsp://127.0.0.1:8554/raw-cam-1
    - ffmpeg:rtsp://127.0.0.1:8554/raw-cam-1#video=h264
  cam-2:
