# The sidecar image's Python dependencies, locked in uv.lock beside this file.
#
# Declare a dependency in a requirements.txt, as before: perception/engine/requirements.txt for the engine,
# perception/modules/<name>/requirements.txt for a module. The [dependency-groups] block below is generated from those
# files (and from the Dockerfile's BASE_MODULES / MTMC_MODULES) by tools/deps/perception_groups.py; `just deps-lock`
# regenerates it and the lock, and a test fails when either is out of date.
#
#   slim  the `slim` image target: the engine + BASE_MODULES
#   mtmc  the `mtmc` image target: slim + MTMC_MODULES + CUDA torch
[project]
name = "iris-perception"
version = "0.1.0"
description = "The DeepStream sidecar's engine and modules: dependencies only, installed into /opt/iris-venv."
requires-python = "==3.12.*"  # the DeepStream 9.0 base image's Python (3.12.3)
dependencies = []

# groups:start (generated by tools/deps/perception_groups.py from the requirements.txt files; do not edit)
[dependency-groups]
engine = ["redis", "opencv-python-headless", "pyyaml", "minio", "prometheus-client"]
module-appearance = ["onnxruntime-gpu>=1.19"]
module-customer-faces = ["insightface"]
module-face-recognition = ["insightface", "onnxruntime-gpu>=1.19"]
module-mtmc = ["yacs", "tabulate", "termcolor", "fvcore", "iopath", "scikit-learn", "ollama", "openai", "onnxruntime-gpu>=1.19"]
module-proximity = ["onnxruntime-gpu>=1.19"]
# slim: BASE_MODULES="face_recognition customer_faces appearance proximity"
slim = [{ include-group = "engine" }, { include-group = "module-face-recognition" }, { include-group = "module-customer-faces" }, { include-group = "module-appearance" }, { include-group = "module-proximity" }]
# mtmc: MTMC_MODULES="mtmc"
mtmc = [{ include-group = "slim" }, { include-group = "module-mtmc" }, "torch", "torchvision"]
# groups:end

[tool.uv]
required-version = ">=0.13.6,<0.14"  # uv 0.13.x: one lock format, so the lock never churns (DEPENDENCIES.md, "uv")
package = false
# The image is linux x86_64 only; resolving for other platforms would lock wheels nothing installs.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# CUDA torch for the mtmc target, from PyTorch's cu130 index (the CUDA 13 generation of the DeepStream 9.0 base).
# `explicit` keeps every other package on PyPI: only the packages named here may come from that index.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
