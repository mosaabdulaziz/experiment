%YAML:1.0
################################################################################
# IRIS NvDCF tracker config — derived from DeepStream's stock
# config_tracker_NvDCF_perf.yml preset with one deliberate delta:
#
#   TargetManagement.maxShadowTrackingAge: 60   (preset: ~40 frames)
#
# Shadow tracking keeps a lost track alive (visual tracker still localizing)
# while the detector fails to confirm it — e.g. a person in a zone tilting or
# crouching gets dropped for a second or two. This buys two things:
#   1. id continuity — re-detections re-associate with the SAME object_id, so the
#      zone-intrusion alert dedup (keyed on object_id) doesn't re-fire on the same
#      person. The 3.0 s ZoneReentryGrace (zone_grace_seconds) is the fallback for
#      dropouts that outlast the shadow window.
#   2. box stability — the sidecar renders boxes for shadow-tracked objects too, so
#      the on-screen box holds through a dropout instead of flickering off and on.
# The preset's ~40 frames terminates too early (track dies, new id, alert re-fires).
# We raise it, but keep it tight: ~60 frames (~2.4 s at 25 fps) — a bit under the 3.0 s
# re-ID grace, so for dropouts in the ~2.4–3.0 s band dedup leans on the spatial
# ZoneReentryGrace fallback rather than same-id continuity. Accepted trade: a
# genuinely-departed person's box clears in ~2.4 s instead of lingering ~5 s (which a
# larger window would now cause, since shadow boxes are drawn).
#
# Everything else intentionally matches the perf preset. If nvtracker rejects
# this file on a new DeepStream version, copy the container's own
# /opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml
# over it and re-apply only the maxShadowTrackingAge delta.
################################################################################

BaseConfig:
  minDetectorConfidence: 0.1894    # If the confidence of a detector bbox is lower than this, then it won't be considered for tracking

TargetManagement:
  enableBboxUnClipping: 1          # In case the bbox is likely to be clipped by image border, unclip bbox
  maxTargetsPerStream: 120         # Max number of targets to track per stream. Recommended to set >10. Note: this value should account for the targets being tracked in shadow mode as well. Max value depends on the GPU memory capacity

  # [Creation & Termination Policy]
  minIouDiff4NewTarget: 0.3686     # If the IOU between the newly detected object and any of the existing targets is higher than this threshold, this newly detected object will be discarded.
  minTrackerConfidence: 0.1513     # If the confidence of an object tracker is lower than this on the fly, then it will be tracked in shadow mode. Valid Range: [0.0, 1.0]
  probationAge: 2                  # If the target's age exceeds this, the target will be considered to be valid.
  maxShadowTrackingAge: 600        # IRIS delta (preset ~40, was 60): frames a lost track survives detector
                                   # dropouts before termination (see header). Raised 60 -> 600 (2s -> 20s
                                   # at 30fps) 2026-09-01 for the attendance spike: a person seated with
                                   # their back to the camera can go undetected for many seconds at a time
                                   # (desk/monitor occlusion + unusual pose); at 60 the track died in 2s,
                                   # a NEW id appeared on re-detection, and their named presence span broke.
                                   # At 600 the same id survives up to 20s of dropout -- and since seated
                                   # people are near-stationary, shadow re-association stays reliable.
  earlyTerminationAge: 1           # If the shadow tracking age reaches this threshold while in TENTATIVE period, the target will be terminated prematurely.

TrajectoryManagement:
  useUniqueID: 0                   # Use 64-bit long Unique ID when assignining tracker ID.

DataAssociator:
  dataAssociatorType: 0            # the type of data associator among { DEFAULT= 0 }
  associationMatcherType: 1        # the type of matching algorithm among { GREEDY=0, CASCADED=1 }
  checkClassMatch: 1               # If checked, only the same-class objects are associated with each other. Default: true

  # [Association Metric: Thresholds for valid candidates]
  minMatchingScore4Overall: 0.4290         # Min total score
  minMatchingScore4SizeSimilarity: 0.3627  # Min bbox size similarity score
  minMatchingScore4Iou: 0.0193             # Min IOU score
  minMatchingScore4VisualSimilarity: 0.3488 # Min visual similarity score

StateEstimator:
  stateEstimatorType: 1            # the type of state estimator among { DUMMY=0, SIMPLE=1, REGULAR=2 }

  # [Dynamics Modeling]
  processNoiseVar4Loc: 6810.8668   # Process noise variance for bbox center
  processNoiseVar4Size: 1541.8647  # Process noise variance for bbox size
  processNoiseVar4Vel: 1348.4874   # Process noise variance for velocity
  measurementNoiseVar4Detector: 100.0000   # Measurement noise variance for detector's detection
  measurementNoiseVar4Tracker: 293.3238    # Measurement noise variance for tracker's localization

VisualTracker:
  visualTrackerType: 1             # the type of visual tracker among { DUMMY=0, NvDCF=1 }

  # [NvDCF: Feature Extraction]
  useColorNames: 1                 # Use ColorNames feature
  useHog: 0                        # Use Histogram-of-Oriented-Gradient (HOG) feature
  featureImgSizeLevel: 2           # Size of a feature image. Valid range: {1, 2, 3, 4, 5}, from the smallest to the largest
  featureFocusOffsetFactor_y: -0.1054 # The offset for the center of hanning window relative to the feature height. The center of hanning window would move by (featureFocusOffsetFactor_y*featureMatSize.height) in vertical direction

  # [NvDCF: Correlation Filter]
  filterLr: 0.0767                 # learning rate for DCF filter in exponential moving average. Valid Range: [0.0, 1.0]
  filterChannelWeightsLr: 0.0339   # learning rate for the channel weights among feature channels. Valid Range: [0.0, 1.0]
  gaussianSigma: 0.5687            # Standard deviation for Gaussian for desired response when creating DCF filter
