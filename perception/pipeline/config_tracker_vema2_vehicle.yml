%YAML:1.0
# VEMA v2 tracker config for multicam vehicle and plate tracking.
# Aligns early_term_lost with process_fps=1.67 (nvinfer interval=3).

tau_high: 0.65
tau_low: 0.15
iou_thresh_high: 0.20
iou_thresh_low: 0.10
ref_fps: 30.0
dt_aware: true

tau_mem: 0.15

probation_frames: 1
max_lost_frames: 500
early_term_lost: 30
min_iou_diff_new: 0.70
check_class_match: true
emit_shadow_tracks: true
border_exit_lost: 6
border_exit_margin_px: 28.0
min_visible_frac: 0.25
max_shadow_emit_lost: 10
max_targets_per_stream: 120
img_width: 1280
img_height: 720
