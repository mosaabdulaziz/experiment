%YAML:1.0
# VEMA-3D tracker config for multicam vehicle and plate tracking.
# Aligns early_term_lost with process_fps=1.67 (nvinfer interval=3) so new
# vehicle tracklets survive skipped inference cycles before confirmation.

# Confidence regimes
tau_high: 0.65
tau_low: 0.15

# Kinematic EMA & 3D depth damping
alpha: 0.80
gamma: 0.98
eps_cal: 0.05
v_var_alpha: 0.85
ref_fps: 30.0
dt_aware: true

# Regime II truncation gate
area_ratio_min: 0.75
cos_min: 0.0
min_speed_ratio: 0.05

# Association & Stage 3 ground-plane relocation
iou_thresh_high: 0.20
iou_thresh_low: 0.10
relocation_cost_thresh: 1.80
biou_rate: 0.06
biou_max_expansion: 2.2
lambda_biou: 1.0
lambda_pos: 0.35
lambda_dir: 0.25
sigma_par_scale: 1.5
sigma_perp_scale: 0.6
base_pos_sigma_ratio: 0.25

# Track lifecycle (500 frames aligns with mtmc.max_unmatched_frames)
probation_frames: 1
max_lost_frames: 500
early_term_lost: 30
min_iou_diff_new: 0.70
check_class_match: true
emit_shadow_tracks: true

# 3D pinhole ground-plane model (optional per-camera cam_height / cam_pitch_deg overrides)
auto_pitch: true
cam_height: 3.5
cam_pitch_deg: 10.0
min_ray_y: 0.02
max_depth: 80.0
pos_3d_process_std: 0.25
lambda_mmd: 0.45
mmd_gate: 12.0
img_width: 1280
img_height: 720
