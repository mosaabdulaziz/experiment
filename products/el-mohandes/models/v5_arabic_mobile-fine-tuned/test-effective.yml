Global:
  model_name: arabic_PP-OCRv5_mobile_rec
  debug: false
  use_gpu: true
  epoch_num: 60
  log_smooth_window: 1
  print_batch_step: 1
  save_model_dir: /kaggle/working/direct-ppocr/v5_arabic_mobile/training
  save_epoch_step: 61
  eval_batch_step:
  - 0
  - 1
  cal_metric_during_train: false
  pretrained_model: ''
  checkpoints: /kaggle/working/direct-ppocr/v5_arabic_mobile/training/best_accuracy
  save_inference_dir: null
  use_visualdl: false
  infer_img: null
  character_dict_path: /kaggle/working/direct-ppocr/v5_arabic_mobile/plate_dict.txt
  max_text_length: 9
  infer_mode: false
  use_space_char: false
  distributed: false
  save_res_path: ./output/rec/predicts_arabic_ppocrv5.txt
  d2s_train_image_shape:
  - 3
  - 48
  - 320
  seed: 42
  eval_batch_epoch: 1
  use_amp: true
  amp_level: O2
  scale_loss: 1024.0
  use_dynamic_loss_scaling: true
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 5.0e-05
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size:
          - 1
          - 3
          use_guide: true
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: 9
Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false
Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: /kaggle/working/direct-ppocr/v5_arabic_mobile
    ext_op_transform_idx: 1
    label_file_list:
    - /kaggle/working/direct-ppocr/v5_arabic_mobile/train.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecAug: null
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales:
    - - 320
      - 32
    - - 320
      - 48
    - - 320
      - 64
    first_bs: 8
    fix_bs: false
    divided_factor:
    - 8
    - 16
    is_training: true
  loader:
    shuffle: true
    batch_size_per_card: 8
    drop_last: true
    num_workers: 2
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/working/direct-ppocr/v5_arabic_mobile
    label_file_list:
    - /kaggle/working/direct-ppocr/v5_arabic_mobile/test.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 8
    num_workers: 2
