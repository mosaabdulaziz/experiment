# Barber sidecar for the Palm Hills shop (branch 2, 2026-10-14): the barber sidecar config with seven sources.
# Picked by BARBER_SIDECAR_CONFIG (products/barber/site.sh). Test clips: test_streamer publishes raw-ph-*;
# real cameras: point go2rtc.yaml's raw-ph-* at them. Keep ids in sync with barber.palm-hills.yaml.
extends: sidecar.yaml

# The model manifest this deployment's model files are checked against at startup (perception/engine/model_manifest.py;
# generated by `python -m mtmc.tracking.manifest generate`). Until it is generated and committed, a missing file only
# warns, unless MODEL_MANIFEST_REQUIRED=1.
model_manifest: products/barber/models.manifest.palm-hills.json

sources:
  - {id: ph-1, uri: "rtsp://go2rtc:8554/raw-ph-1", roles: [barber]}
  - {id: ph-2, uri: "rtsp://go2rtc:8554/raw-ph-2", roles: [barber]}
  - {id: ph-3, uri: "rtsp://go2rtc:8554/raw-ph-3", roles: [barber]}
  - {id: ph-4, uri: "rtsp://go2rtc:8554/raw-ph-4", roles: [barber]}
  - {id: ph-5, uri: "rtsp://go2rtc:8554/raw-ph-5", roles: [barber]}
  - {id: ph-6, uri: "rtsp://go2rtc:8554/raw-ph-6", roles: [barber]}
  - {id: ph-7, uri: "rtsp://go2rtc:8554/raw-ph-7", roles: [barber]}

modules:
  appearance:
    # Palm Hills' own staff classifier; `just barber-palm-staff r3|r4` switches it together with barber.palm-hills.yaml's
    # staff_threshold (each model's .json has its own). Bekky keeps staff_dinov2_s.onnx.
    #  r4 staff_dinov2_s_palm.onnx (2026-10-21): Bekky r1+r2 and both Palm days (946 frames of 10 Oct, 1820 of 16 Oct);
    #     16 Oct held-out blocks AUROC 0.987 -> 0.995 (same day as its training), 10 Oct test 0.992 -> 0.989. At 0.90:
    #     10 Oct test 87 % staff recall, 2.2 % of customers called staff.
    #  r3 staff_dinov2_s_palm_r3.onnx (2026-10-14): the round-2 model fine-tuned on 946 Palm frames of 10 Oct. At 0.79:
    #     10 Oct test 90 % staff recall, 2.7 % of customers called staff.
    staff_classifier: "/workspace/iris/perception/models/staff/staff_dinov2_s_palm.onnx"
    # Palm's own crops root (customer faces, body crops, the alerts/ folder barber-service writes into): never the same
    # as, or inside, Bekky's -- each site's service sweeps its whole root. = barber.palm-hills.yaml's crops_dir.
    crops_dir: "/workspace/iris/data/barber/crops-palm-hills"
  customer_faces:
    crops_dir: "/workspace/iris/data/barber/crops-palm-hills"
