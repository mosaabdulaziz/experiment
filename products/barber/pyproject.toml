[project]
name = "barber-service"
version = "0.1.0"
description = "Barber shop monitoring — consumes surveillance-camera-sys's Redis streams (person tracks + face IDs), never imports its code."
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "python-docx>=1.1",            # reports as Word (2026-10-15)
    "onnxruntime>=1.18",           # the kids car detector, CPU (2026-10-15)
    "pillow>=10",                  # its JPEG frames
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
required-version = ">=0.13.6,<0.14"  # uv 0.13.x: one lock format, so the lock never churns (DEPENDENCIES.md, "uv")
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# third-party deprecations from fastapi's TestClient (starlette/httpx/anyio), not our code
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
