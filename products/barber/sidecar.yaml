# Barber shop monitoring -- sidecar overlay. Only what differs from
# sidecar.yaml lives here; everything else (models, face-ID tuning, recording)
# is inherited, so a knob tuned there can't silently drift here.
# Run by the `deepstream-sidecar-barber` compose service (profile: barber);
# consumed by products/barber/ over Redis (iris:meta person boxes,
# iris:appearance re-ID + staff scores, iris:customer_face).
extends: ../../perception/pipeline/sidecar.yaml

# The model manifest this deployment's model files are checked against at startup (perception/engine/model_manifest.py;
# generated by `python -m mtmc.tracking.manifest generate`). Until it is generated and committed, a missing file only
# warns, unless MODEL_MANIFEST_REQUIRED=1.
model_manifest: products/barber/models.manifest.bekky.json

sidecar_role: barber   # also forced by IRIS_SIDECAR_ROLE=barber in compose

# Three cameras, one pipeline: batching them in one nvstreammux keeps their
# frames on one clock, which the engine's paired-zone handoff relies on.
# barber-c = centre (door, sofa, washing), barber-l = left camera (the chair
# row on the centre view's RIGHT), barber-r = right camera (the row on the
# centre view's LEFT). Test clips: test_streamer publishes raw-barber-*;
# real cameras: point go2rtc.yaml's raw-barber-* at them. Keep ids in sync
# with products/barber/barber.yaml.
sources:
  - {id: barber-c, uri: "rtsp://go2rtc:8554/raw-barber-c", roles: [barber]}
  - {id: barber-l, uri: "rtsp://go2rtc:8554/raw-barber-l", roles: [barber]}
  - {id: barber-r, uri: "rtsp://go2rtc:8554/raw-barber-r", roles: [barber]}

# Frame size: the camera's own 16:9, not the base 1080x720. The mux scales
# without keeping the aspect ratio (enable-padding is off), so 1080x720 squeezed
# a 1280x720 picture to 84% of its width -- faces came out 16% narrower than
# real, which face alignment can't undo (2026-09-16). Faces in this shop are
# already ~27 px; they need every pixel. Must match products/barber/barber.yaml.
mux_width: 1280
mux_height: 720
capture_width: 1280
capture_height: 720

# Few streams, so tracking accuracy comes before throughput: NVIDIA's NvDCF
# accuracy preset with IRIS's long shadow tracking (see the file's header).
tracker_config: "products/barber/tracker.yml"

# Zones are evaluated by products/barber, not by the pipeline; no fire or zones module (none is listed under `modules:`).
relevant_classes:
  - person

# Chair engine (project 3, 2026-10-04): a YOLO26-seg model is the only detector (boxes + masks);
# its outlines feed products/barber's seat rule. The face stage runs only inside the door area (below).
# The ONNX comes from `just barber-seg-model`, the parser .so from the sidecar image (perception/pipeline/Dockerfile).
# 2026-10-04, project 3: YOLO26l-seg at 640x384 chosen by the user after the live detection check
# (640x384 input is ~33 % faster than the 640x640 m-model; scaling method 2 raised seated-customer
# recall 84 -> 90 % on the m-model).
pgie_config: "/workspace/iris/perception/models/DeepStream-Yolo-Seg/config_infer_primary_yolo26l_seg_r384.txt"
mux_interpolation_method: 2
# What this product's pipeline runs, in this order (see perception/modules/README.md):
modules:
  # Chair engine (2026-10-04): with the segmentation PGIE, each person's mask outline on meta frames as iris:meta
  # "person_masks" ([object_id, conf, [x1, y1, ...] | null]), and the tracked people's boxes as "person_boxes".
  person_boxes: {}
  person_masks: {}
  # Customers are kept apart by body re-ID, staff are told by uniform (perception/modules/appearance); products/barber
  # reads iris:appearance:<cam>.
  appearance:
    # Project A (2026-09-26): the trained staff classifier replaces zero-shot CLIP (test, at staff_threshold 0.70: 1.6%
    # of customers scored staff at 91.6% staff recall, vs ~34% for CLIP). Round 2 (2026-10-07): retrained with 369 more
    # hand-checked frames of hard staff views (test AUROC 0.985 -> 0.989 on round one's set, 0.969 -> 0.979 on round
    # two's). Rollback = the previous staff_dinov2_s.onnx/.json from git + a sidecar restart; to CLIP = "clip" + a
    # sidecar restart + staff_threshold back to 0.55.
    staff_model: "classifier"
    # chair engine: customer pictures come from body crops of the seated person
    crops_dir: "/workspace/iris/data/barber/crops"
  # Face register at the door (2026-10-05): faces only for centre-camera people inside the door area (products/barber
  # publishes the door_area zones to Redis under regions_key; perception/modules/face_detect/regions.py).
  face_detect:
    # Keep Barber on yolov8n-face + buffalo_l until customer matching is calibrated for the commercial stack;
    # Attendance uses the default face_det_lite + auraface stack.
    config: "/workspace/iris/perception/models/DeepStream-Yolo-Face/config_sgie_face_yolov8n.txt"
    # A barber leaning over a seated customer puts her face inside his (smaller) box; `legacy` would give her name to
    # the customer. Measured on the barber clip: 0 of 67,170 faces landed in 2+ boxes needing the fallback (2026-09-21).
    owner_mode: tracked
    owner_fallback: highest-top
    landmarks: true
    # Face detection only on the frames whose meta is published (2026-09-30): the face SGIE ran on every person of
    # every frame at 24-30 fps, ~40% of the sidecar's GPU time, while only the sample_fps (12) frames are ever read.
    sample_only: true
    regions_key: "barber:face_regions"
    # No idle_when_unused (2026-10-07, review finding 4): the detector idles while the gallery is empty and nothing
    # captures faces -- both are true here, so on a fresh Redis the door register got no faces at all, silently.
    # Customer faces need the detector always.
  # Nobody is enrolled for barber face-ID any more (staff are told by uniform, customers by the register's own face
  # store). The recogniser still runs; this key only keeps it off attendance's employee gallery. Nothing enrols into
  # it. No capture: unknown door faces must not enter the CCTV face gallery.
  face_recognition:
    model: "buffalo_l"
    gallery_key: "barber:face:gallery"
    enhancement: {}
  # Tuned 2026-10-06 on a 39-min lap (products/barber/dev/chairrun/FACES.md): this top-down camera's faces are 24-31 px,
  # seen as people walk toward it; 25 px + the register's match_threshold 0.70 gave cards with no wrong merge.
  # 2026-10-11 (user: capture more entrants): on the night synced3 lap 99 of 945 door faces passed, 0 of 15 entries got
  # a card; rejected for sharpness 505, size 196, yaw 109 -> loosened a step (matching rules unchanged).
  # 2026-10-12 (user: option 2): 20 px, sharpness 5. Live, sharpness rejected 601 of 987 faces (size none); on the
  # synced3 face study (9 people) cards 3 -> 6, faces at sharpness 5-10 match their own track as well as sharper
  # ones and no two people reach 0.48 (match_threshold 0.70).
  customer_faces:
    model: "buffalo_l"
    interval_s: 0.25
    min_pixels: 20
    min_sharpness: 5.0
    max_yaw: 0.9

# No annotated preview (2026-09-26): the barber UI plays go2rtc's raw
# barber-* streams, so nothing reads iris:jpeg:barber-*. The preview cost a
# GPU->CPU frame copy on the streaming thread for ~2/3 of all frames (72% of
# that thread) plus a draw and a GPU JPEG encode each, which kept the three
# cameras at a median 16 fps with dips to ~9, and a silent source stall (then
# a wedged main loop) followed ~1 in 3 of those dips. Frames are still copied
# for face recognition and appearance when those need them.
pipeline_preview: false

# A wedged main loop never clears by itself (61 of 61 on 2026-09-25/26 ran
# the full 60 s), so end it sooner: the stalled camera is back in ~40 s
# instead of ~85 s. Nothing on the loop takes seconds (1 s Redis polls).
main_loop_stall_seconds: 20

# A camera that stays dead after the stall watch restarted it twice ends the
# sidecar (exit 71), and the container restart brings every camera back:
# 2026-09-26 two cameras stayed dead through an hour of source restarts after
# the test streams restarted, and a real camera reboot does the same. With
# the 15 s stall and doubling backoff that is ~105 s after its last frame
# (45 s if every camera went silent at once). See sidecar.yaml.
source_stall_max_failed_restarts: 2
