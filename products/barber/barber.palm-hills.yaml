# Barber service configuration for the second shop, Bekky Palm Hills ("branch 2", 2026-10-14; spec
# docs/superpowers/specs/2026-10-14-barber-branch2-testbed-design.md). Picked by `just barber_site=palm-hills ...`
# (products/barber/site.sh). Seven cameras, no door camera. Test clips: the 2 h synced recording of 2026-10-10
# 19:00-21:00 (/data/IRIS/data/BekkyBarber/palm_hills, test_streamer CAM_FILES ph-1..ph-7).

# Reports (2026-10-15): the business and branch on a report and in its file name.
# The model manifest (the same file as this site's sidecar yaml names): the kids car model is checked against it at
# startup. Until it is generated and committed, a missing file only warns, unless MODEL_MANIFEST_REQUIRED=1.
model_manifest: products/barber/models.manifest.palm-hills.json

place: BekkyBarber
branch: Palm Hills
branch_slug: palmhills
# the shop's logo on reports and the dashboard's rail (png / jpg / svg); unset = a text wordmark. 2026-10-18: Bekky's
# own logo (the user's file, 4x, transparent; the rail shows it white)
logo: assets/bekky-barber-logo.png

redis_url: "redis://localhost:6379/0"
engine: chair
data_dir: "data/palm-hills"            # its own zones, policy and DB (relative to products/barber/)
# The tuned zones (2026-11-12): zones.palm-hills.json, beside this file. Setup saves into data_dir/zones.json (not in
# git); a reviewed zones.palm-hills.json is deployed by copying it there (back the old file up first).
# Its own face/body photos and alert snapshots: a sibling of Bekky's root, never inside it -- each service's orphan
# sweep walks its whole crops root and deletes what its own DB doesn't reference (one shared root lost Bekky's cards).
# = sidecar.palm-hills.yaml's customer_crops_dir (the repo is /workspace/iris in the sidecar container).
crops_dir: "../../data/barber/crops-palm-hills"

frame:
  width: 1280
  height: 720

cameras:
  - {id: ph-1, name: "Wash area", clip_duration_s: 7200, clear_on_loop: true}
  - {id: ph-2, name: "Stations wide", clip_duration_s: 7200, clear_on_loop: true}
  - {id: ph-3, name: "Reception front", clip_duration_s: 7200, clear_on_loop: true}
  - {id: ph-4, name: "Stations close", clip_duration_s: 7200, clear_on_loop: true}
  - {id: ph-5, name: "Reception lounge", clip_duration_s: 7200, clear_on_loop: true}
  - {id: ph-6, name: "Pedicure", clip_duration_s: 7200, clear_on_loop: true}
  - {id: ph-7, name: "VIP room", clip_duration_s: 7200, clear_on_loop: true}

# Waits run on the camera that sees both sofas (no entrance line in this shop).
wait_camera: ph-3

# saved reports (2026-10-25, user): each shop day's analysis + haircut photo reports when the day ends (the site's day_start_hour), each
# Saturday-Friday week's and month's analysis report, into data/<site>/reports/ (saved_reports.py); was daily_report
saved_reports: {langs: [en, ar], formats: [pdf, html], week_start: sat}

# Site defaults over DEFAULT_POLICY. data/palm-hills/policy.json holds only the keys set in Setup: after a key is set
# in Setup, the stored value wins for that key; every other key follows this block. (A policy.json written before
# 2026-10-15 holds every key: take a key out of it to let this block's value show through.)
policy:
  wt_end_mode: 1
  wt_out_s: 3
  wt_return_sim: 0.82
  wt_return_max_s: 1800
  wt_return_min_samples: 2
  wt_return_extra_s: 30
  wt_serve_s: 150
  visits_source: 1
  register_source: 2         # seated faces from face_area zones (Task 11's probe); chairs without one keep body crops
  staff_threshold: 0.90      # = the Palm staff model's .json (sidecar.palm-hills.yaml; just barber-palm-staff sets both)
  # 2026-10-15 (sub-project 6, item 1: a quick hand-over merged the next customer into the haircut; GT test hour,
  # replays of laps 3 and 1 in .run/gtp/sweep*): the barber covers a chair only with his lower 30 % on the seat, a
  # 50 s away gap, the customer's lower 45 % measured on the seat, re-ID decides a re-taken chair (15 min at most).
  # Lap 3: haircuts 3/6 -> 6/6, merged 2 -> 0, false sitting breaks 3 -> 1; lap 1: 3/6 -> 5/6, merged 2 -> 0.
  ce_carry_lower_frac: 0.30
  ce_end_gap_s: 50
  ce_lower_frac: 0.45
  ce_min_haircut_s: 300     # 2026-10-18 (user): unrecognised staff opened 1-5 min haircuts (23 of 110 on 16-17 Oct)
  # 2026-11-12 (16 Oct spike, user): a haircut opened by a re-ID "new customer" verdict counts only after 7 min -- a
  # customer back from the wash whom re-ID missed (R1 18:20, 0.52) sat 6.3 min. The back-view chairs R1 (ph5-R2) and
  # L5 keep a sitting 120 s with the customer hidden (50 s elsewhere): R1 15:19 was hidden 75 s behind his barber and
  # came back as a second haircut. On the 16 Oct replay each removes its false haircut and changes nothing else.
  ce_min_after_new_s: 420
  ce_end_gap_s@ph5-R2: 120
  ce_end_gap_s@ph3-L5: 120
  # 2026-11-12 (16 Oct spike, user): a customer back in his chair within 10 min (was 6) needs re-ID's lower score
  # only -- R1 15:19 came back after 9.4 min and was split on the strict one. L7 is counted on the reception lounge
  # camera (ph-5, zones.palm-hills.json; ph-3's L7 stays as its pair): the false 19:09 split goes. With the two keys
  # above, the 16 Oct replay serves 42 (was 45; ground truth 41).
  ce_resume_window_s: 600
  # 2026-11-14 (user): the lower re-ID score 0.652 (was 0.65). 6 Nov L7 21:08, a new customer, scored 0.6506 and was
  # merged; 16 Oct L7 19:08, a true return, scored 0.6534. Replays: 6 Nov L7 19:01-22:01 splits at 21:08 (38 -> 39),
  # 16 Oct identical. A 0.003 gap on two recordings: expect it to move on another day.
  ce_resume_sim_low: 0.652
  # 2026-11-12 (user: two VIP1 haircuts on 16 Oct were staff members' own): on the VIP chairs, a haircut whose sitter
  # looked staff before he sat down and after he got up is voided (16 Oct replay: exactly those two, 42 -> 40). Not on
  # the busy chairs, where a barber or cleaner by the seat fakes the cue (R2 15:31 on 16 Oct).
  ce_staff_cut_check@ph7-VIP1: 1
  ce_staff_cut_check@ph7-VIP2: 1
  # 2026-11-13 (user; 6 Nov, L7 21:08): the barber's cover holds a sitting only while it fills 30 % of the last 10 s of
  # frames -- a staff member brushing an empty chair's zone no longer bridges two customers. Every chair. Replays: 16 Oct
  # 4 errors -> 1 (L7 16:52 merge, false L6 17:49 and L7's early start gone; 50 % gives the same); 6 Nov unchanged.
  ce_cover_min_frac: 0.3
  # 2026-11-14 (user; 6 Nov L6 19:47: a standing staff member cut by ph-5's frame edge; 16 Oct L5 14:09 / 14:54: a kid
  # counted twice): a haircut seen on its seat in under 22 % of its sittings' frames, or under 35 % when it sat less than
  # 15 min, stays but is marked low occupancy -- the report counts it apart and highlights it. Every chair. Replays: 16 Oct
  # 38 (+2: both L5), 6 Nov 37 (+1: L6 19:47); the real ones nearest: R1 20:08 (21 min, 26 %), R2 18:04 (18 min, 41 %).
  ce_low_occupancy: 0.22
  ce_low_occupancy_short: 0.35
  # 2026-10-18 (user): a bag on VIP2 was a 7-min haircut. A haircut there needs its occupant to move: the bag's box
  # edges stayed within 0.002 of the frame for 5 min; real sittings moved 0.012+. Today 13:55-18:23 replayed: only
  # the bag's haircut goes (11 others identical); GT hour laps 1 and 3 unchanged. The VIP chairs only for now (user:
  # a still customer elsewhere must not be dropped).
  ce_object_spread@ph7-VIP1: 0.005
  ce_object_spread@ph7-VIP2: 0.005
  # 2026-10-22 (user): clothes left on VIP2 at closing (16 Oct 22:49) were a 5-min haircut -- re-arranged by the staff
  # and flickering, their box "moved". A VIP haircut also needs the detector to be sure of its occupant: median conf
  # 0.72+. Clothes 0.66, the 18 Oct bag 0.48; real VIP haircuts 0.81-0.88 (6 on 16 and 18 Oct: all still confirmed at
  # 5 min; a crowded one 2.8 min later). The two VIP chairs only (user).
  ce_object_conf@ph7-VIP1: 0.72
  ce_object_conf@ph7-VIP2: 0.72
  hp_photos: 1              # 2026-10-22 (user): a start and an end photo of every haircut, for the photo report
  # 2026-10-18 (user): the barber's cover keeps a sitting 4 min (default 2) on the chairs whose customers went "away"
  # under him most (16-17 Oct: L6 29 breaks in 22 haircuts, L5 6/5, R2 10/17, L7 8/19). GT hour: caps of 5 / 10 min /
  # none keep 6/6 and nothing merged (a fuller body share merged L6's next customer). L6 / L7 are the pair ids since
  # their move to ph-5 / ph-3 the same day; ph5-R1 is the chair shown as R2.
  ce_carry_max_s@ph3-L5: 240
  ce_carry_max_s@L6: 240
  ce_carry_max_s@ph5-R1: 240
  ce_carry_max_s@L7: 240
  ce_resume_check: 1
  ce_resume_max_s: 900
  # 2026-10-15: on a seat, a staff track turns non-staff only after 2 non-staff samples in a row (one dip made a
  # resting barber a sitter: lap 3's 98 s L7 blip + its false served link gone, 6/6; lap 1 unchanged; 3 adds a
  # 274 s false break on L8).
  ce_staff_release_n: 2
  # 2026-10-15 (item 3, the two teens one wait): the side sofa's halves on ph-1 / ph-5, paired with ph-3's sofa-side
  # (owner), add extra waits for people ph-3 sees as one. Lap 3: waits 4/5 -> 5/5, average wait 754 -> 651 s (GT 607).
  wt_extra_views: 1
  # 2026-10-15 (sub-project 4): the Kids chair follows the toy car (kids_car.py; needs the model file).
  kc_enabled: 1
