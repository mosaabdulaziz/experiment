# ── Fire and smoke: part of THIS product (2026-09-23) ────────────────────────
# Fire is not a product of its own: it is attendance's second detector, and its
# incidents and clips are served by app/ alongside zone and overcrowding alerts.
# These values are declared here, not inherited, because they are policy -- what
# counts as an alert and how long it must last. perception/modules/fire_alerts/
# README.md says why each number is what it is (tuned on real footage).
# What this product's pipeline runs, in this order (see perception/modules/README.md). The face settings take the
# values this product was calibrated with on the elevator clip -- their history is in
# perception/modules/face_recognition/README.md and face_detect/README.md.
modules:
  person_boxes: {}                 # the tracked people's boxes in iris:meta (the collision guard reads them); keep
                                   # it before any module that filters detections, so it reports everyone
  face_detect:
    # Which person box a face belongs to. Declared, not inherited: it applies to every camera of this process and
    # decides what the recognizer sees. `legacy` is the rule this product's recognition values (threshold, votes,
    # lock, margin) were calibrated against on the elevator clip; barber runs `tracked` for barbers leaning over
    # seated customers. Switching re-opens that calibration, so measure on the clip first (2026-09-22).
    owner_mode: legacy
    landmarks: true
    # Switch the detector off while no face is registered and nothing captures faces (zero GPU); `capture` mirrors
    # face_recognition's below, since a capturing recogniser fills the gallery from the detector's output.
    idle_when_unused: {gallery_key: "attendance:face:gallery", capture: true}
  face_recognition:
    gallery_key: "attendance:face:gallery"    # forked for the products/attendance spike (ticket 02)
    capture: {}                               # save unknown CCTV faces as gallery candidates (web UI: Face Gallery)
    enhancement: {}                           # upscale small faces before embedding
  fire_alerts:
    interval: 0                    # infer every frame
    classes: [fire, smoke]
    fire_sustain_seconds: 2.0      # a fire must persist this long before it alerts
    smoke_sustain_seconds: 4.0     # smoke is noisier, so it needs longer
    release_seconds: 10.0          # how long after the last detection the alert clears
    min_confidence: 0.45
    dropout_grace_seconds: 1.0
