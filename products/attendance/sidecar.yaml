# Attendance (with fire/smoke) -- sidecar overlay. Only what this product
# declares for itself lives here; everything else is inherited from
# sidecar.yaml, so a knob tuned there can't silently drift here.
# Run by the plain `deepstream-sidecar` compose service:
#   SIDECAR_CONFIG=products/attendance/sidecar.yaml
# Consumed by attendance-service/ over Redis (iris:meta + iris:face_rec) and by
# app/ for fire incidents and clips.
extends: ../../perception/pipeline/sidecar.yaml

# The model manifest this deployment's model files are checked against at startup (perception/engine/model_manifest.py;
# generated by `python -m mtmc.tracking.manifest generate`). Until it is generated and committed, a missing file only
# warns, unless MODEL_MANIFEST_REQUIRED=1.
model_manifest: products/attendance/models.manifest.json

# Attendance lists no `zones` module (no zone analytics, so no overcrowding either); the cameras here
# count people through the face-recognition path. List `zones:` under `modules:` to turn them on.

# ── Roles: one image, two processes (compose profile `roles`) ───────────────────
# What a ROLE (IRIS_SIDECAR_ROLE, which selects sources by their `roles:` tag) changes in this file's settings. A role can
# set engine keys and leave modules out of its process; a role with no entry changes nothing.
role_overrides:
  fire:                                  # fire cameras: the fire detector only, no COCO detector, no zone/face work
    pgie_enabled: false
    drop_modules: [zones, face_detect, face_recognition, customer_faces]
  attendance:
    drop_modules: [fire_alerts]
# Recording state (the segment index, the smart-record folder) is flushed at boot, so exactly one process may own a source's.
# An untagged source belongs to this role; a tagged one to the role(s) it names.
untagged_recording_owner: attendance

# ── The cameras this product owns (moved out of the shared file, 2026-09-23) ─
sources:
    # Pull the raw ingest directly (rtsp://go2rtc:8554/raw-cam-N) so DeepStream
    # always sees the ORIGINAL codec. The derived cam-N streams are the
    # browser-facing ones (go2rtc.yaml reorders them transcode-first).
    - {id: cam-1, uri: "rtsp://go2rtc:8554/raw-cam-1", roles: [attendance]}
    - {id: cam-2, uri: "rtsp://go2rtc:8554/raw-cam-2", roles: [attendance]}
    - {id: cam-3, uri: "rtsp://go2rtc:8554/raw-cam-3", roles: [attendance]}
    # 2026-09-12: cam-4/5 and the whole CHIRLA seq_004/seq_020 attendance
    # block below (cam-9..cam-20) commented out, TEMPORARILY, to test a
    # theory: user asked whether a ~25s table-lag on cam-21 could be caused
    # by "having several cams running", and diagnosis found the real cause
    # candidate isn't the LIVE cams (only cam-1/2/3 + cam-21 actually have
    # anything to show right now) but that sidecar.yaml had 21 sources
    # CONFIGURED while only 4 had anything to stream -- DeepStream batches
    # inference across every CONFIGURED source each cycle regardless of
