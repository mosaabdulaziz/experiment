# Fall detection -- sidecar overlay. Only what this product declares for itself lives here;
# everything else is inherited from sidecar.yaml, so a knob tuned there can't silently drift here.
# Run by the `deepstream-sidecar-fall` compose service (profile: fall); consumed by
# products/fall_detection/ over Redis: the service reads iris:meta and its `pose` field, which is
# this pipeline's only job here.
extends: ../../perception/pipeline/sidecar.yaml

# The model manifest this deployment's model files are checked against at startup (perception/engine/model_manifest.py;
# generated by `python -m mtmc.tracking.manifest generate`). Until it is generated and committed, a missing file only
# warns, unless MODEL_MANIFEST_REQUIRED=1.
model_manifest: products/fall_detection/models.manifest.json

sidecar_role: fall_detection   # also forced by IRIS_SIDECAR_ROLE=fall_detection in compose

# ── The cameras this product owns ─────────────────────────────────────────────
# The pilot runs on cam-1 only (FALL_DETECTION_DESIGN.md §13.1). The three-camera set is
# configs/presets/fall_3cam/sidecar.yaml, which only replaces these sources.
sources:
  - {id: cam-1, uri: "rtsp://go2rtc:8554/raw-cam-1", roles: [fall_detection]}

# This product is about people: the pose detector's own items (class `pose`) are filtered out of
# the published detections by this list, so only the people's boxes reach the dets.
relevant_classes:
  - person

# ── What this product's pipeline runs ──────────────────────────────────────────
# The pose module: a secondary GIE on every tracked person, publishing the `pose` field (the
# keypoints in capture pixels) that the service feeds to the monitor. The pilot runs it at 12.5 Hz
# on a 25 Hz pipeline; 25 Hz is the experiment the corpus replay measures (requirement N2), and the
# camera count and the model size are the levers after that (design §3.5).
modules:
  pose:
    # The model, by name. It must be the model the GIE's config file loads (its onnx-file); the
    # module refuses to start when they disagree, so a half-finished switch fails the boot.
    # Switching models: perception/models/DeepStream-Yolo-Pose/MODEL_SWITCH.md.
    model: yolo26x-pose
    interval: 2
    # The detection floor: the parser's threshold, which the GIE's config file declares as
    # pre-cluster-threshold. The two must agree or the module refuses to start.
    detection_threshold: 0.25
