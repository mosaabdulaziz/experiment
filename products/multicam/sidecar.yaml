# Multi-camera vehicle tracking -- sidecar overlay. Only what this product declares for
# itself lives here; everything else is inherited from perception/pipeline/sidecar.yaml
# (the shared file stays neutral: it starts no detector a product did not ask for).
# Run by the `deepstream-sidecar-multicam` compose service (profile `multicam`, image
# target `mtmc`):
#   SIDECAR_CONFIG=products/multicam/sidecar.yaml
# Cameras, the 1-class vehicle detector and its tracker, MTMC (cross-camera Re-ID), the
# VLM arbiter, plate reading and box stabilization are this product's policy.
# Generated from the former configs/presets/scale13/sidecar.yaml on the merge with main
# (2026-10); the comments on each block are the originals.
extends: ../../perception/pipeline/sidecar.yaml

# The model manifest this deployment's model files are checked against at startup (perception/engine/model_manifest.py;
# generated by `python -m mtmc.tracking.manifest generate`). Until it is generated and committed, a missing file only
# warns, unless MODEL_MANIFEST_REQUIRED=1.
model_manifest: products/multicam/models.manifest.json


# Simulated cameras: test_streamer/stream_recordings.py loops each upload
# through ffmpeg (-c copy, original codecs) and publishes it to go2rtc's RTSP
# ingest as raw-<cam-id>; go2rtc derives <cam-id> (original + on-demand H.264
# transcode for browsers) which the sidecar consumes over real RTSP, so
# recording uses Smart Video Record (recorder: auto -> rtsp:// => svr). See
# test_streamer/README.md. To switch back to direct file playback, restore the
# file:// URIs (the upload names are in test_streamer/stream_recordings.py's
# CAM_FILES).
sources:
    # Pull the raw ingest directly (rtsp://go2rtc:8554/raw-cam-N) so DeepStream
    # always sees the ORIGINAL codec. The derived cam-N streams are the
    # browser-facing ones (go2rtc.yaml reorders them transcode-first).
    # Bypass go2rtc — use file:// directly to avoid RTSP corruption (especially HEVC)
    # - {id: cam-01, uri: "rtsp://go2rtc:8554/raw-cam-1"}
    # - {id: cam-02, uri: "rtsp://go2rtc:8554/raw-cam-2"}
    # - {id: cam-03, uri: "rtsp://go2rtc:8554/raw-cam-3"}
    # - {id: cam-04, uri: "rtsp://go2rtc:8554/raw-cam-4"}
    # - {id: cam-05, uri: "rtsp://go2rtc:8554/raw-cam-5"}
    # - {id: cam-06, uri: "rtsp://go2rtc:8554/raw-cam-6"}
    # - {id: cam-07, uri: "rtsp://go2rtc:8554/raw-cam-7"}
    # - {id: cam-08, uri: "rtsp://go2rtc:8554/raw-cam-8"}
    # - {id: cam-09, uri: "rtsp://go2rtc:8554/raw-cam-9"}
    # - {id: cam-10, uri: "rtsp://go2rtc:8554/raw-cam-10"}
    # - {id: cam-11, uri: "rtsp://go2rtc:8554/raw-cam-11"}
    # - {id: cam-12, uri: "rtsp://go2rtc:8554/raw-cam-12"}
    # - {id: cam-13, uri: "rtsp://go2rtc:8554/raw-cam-13"}
    - {id: cam-01, uri: "rtsp://go2rtc:8554/raw-cam-1"}   # D41
    - {id: cam-02, uri: "rtsp://go2rtc:8554/raw-cam-2"}   # D16
    - {id: cam-03, uri: "rtsp://go2rtc:8554/raw-cam-3"}   # D52
    - {id: cam-04, uri: "rtsp://go2rtc:8554/raw-cam-4"}   # CH13
    - {id: cam-05, uri: "rtsp://go2rtc:8554/raw-cam-5"}   # CH22
    - {id: cam-06, uri: "rtsp://go2rtc:8554/raw-cam-6"}   # CH23
    - {id: cam-07, uri: "rtsp://go2rtc:8554/raw-cam-7"}   # CH06
    - {id: cam-08, uri: "rtsp://go2rtc:8554/raw-cam-8"}   # CH30
    - {id: cam-09, uri: "rtsp://go2rtc:8554/raw-cam-9"}   # CH24
    - {id: cam-10, uri: "rtsp://go2rtc:8554/raw-cam-10"}   # D15
    - {id: cam-11, uri: "rtsp://go2rtc:8554/raw-cam-11"}   # D18
    - {id: cam-12, uri: "rtsp://go2rtc:8554/raw-cam-12"}   # D31
    - {id: cam-13, uri: "rtsp://go2rtc:8554/raw-cam-13"}   # D28
    - {id: cam-14, uri: "rtsp://go2rtc:8554/raw-cam-14"}   # D05
    - {id: cam-15, uri: "rtsp://go2rtc:8554/raw-cam-15"}   # D20

pgie_config: "/workspace/iris/perception/models/DeepStream-Yolo/config_infer_primary_vehicle_1cls.txt"

# INT8 calibration inputs for the pgie (yolo11s). Only consulted when
# config_infer_primary_yolo11.txt sets network-mode=1 (INT8); the custom YOLO
# parser's calibrator (compiled with OPENCV=1) reads these env vars at
# engine-build time and writes the calibration cache to the config's
# int8-calib-file. Generate the image list first with:
#   python3 DeepStream-Yolo/tools/gen_int8_calib_table.py --video <source>
int8_calib_img_path: "/workspace/iris/mtmc/calib_images.txt"


# gdb on a stall pauses the whole process while it loads symbols (minutes on this machine, 2 GB), which
# froze every stream for 2.5 minutes after a short, harmless stall: Python stacks only.
flight_native_dump: false
# Repo-owned NvDCF config (perf preset + long shadow tracking so brief detector
# dropouts keep the same object_id). Relative to the sidecar's cwd; takes effect
# on the next sidecar restart.
tracker_config: "perception/pipeline/config_tracker_nvdcf_vehicle.yml"  # vehicle/MTMC-tuned; perception/pipeline/config_tracker_nvdcf.yml is the attendance-tuned default

mux_width: 1280
capture_width: 1280

sample_fps: 2
# Preview-publish rate (JPEGs written to iris:jpeg:<id> for the website).
# With analysis_fps active the preview is capped at the analysis rate (the
# probe publishes from the analysis branch); with process_fps only, it runs at
# stream_fps on every frame.
stream_fps: 5             # preview tiles at 5 fps (measured 2026-10-04: same GPU, ~100 % less sidecar CPU than 10)
viewer_gated_preview: true
# ── Rate limiting: analysis_fps (videorate) vs process_fps (pgie interval) ─
# Two independent knobs — alternatives, never combined (when analysis_fps > 0
# the code forces infer_interval = 1).
#
# analysis_fps — a GStreamer videorate + capsfilter between each source's tee
# and the mux caps the WHOLE analysis branch (nvinfer, nvtracker,
# nvvideoconvert, probe → preview) at ~analysis_fps frames/s per source. This
# is the biggest per-stream GPU saving (inference + tracker + convert + probe
# all scale down). Trade-offs: the website preview runs at ~analysis_fps too
# (coherent but low-fps for small values), and the actual rate is PTS-
# quantized for non-integer source/analysis ratios (24 fps source → af=10
# measures ~10; 25 fps source → af=10 measures ~8.4). Decode still runs at the
# source's full rate (videorate is post-decode). Production default: 10.
# 0 = disabled (direct tee->mux link).
#
# process_fps — nvinfer `interval`: inference on every Nth batch
# (N = stream_fps / process_fps); skipped batches propagate the last
# detections, so the pipeline stays full-rate and the preview stays smooth at
# stream_fps while only inference is reduced. Use this instead when preview
# smoothness at native rate matters more than the extra tracker/convert
# savings. 0 = infer every frame.
# process_fps — throttles nvinfer inference to every Nth frame (N=stream_fps/process_fps)
# WITHOUT inserting a videorate element. This is the correct throttle knob for
# file:// sources because analysis_fps (videorate) + mux_sync_inputs=1 causes a
# DEADLOCK for file sources (videorate re-times PTS which confuses the sync logic,
# especially at file-loop boundaries when different-duration files reset PTS at
# different times). process_fps=5 at stream_fps=10 → infer every 2nd frame.
# inference interval = round(stream_fps / process_fps) = round(5 / 1.67) = 3: the detector runs on every 3rd
# frame (~7/s per camera at 20 fps). Measured on the RTX 5050 laptop with 15 x 1440p: every 2nd frame = GPU core
# avg 73 % (90 %+ for 19 % of the time), every 3rd = 65 % (3 %), every 4th = 46 % (3 %).
process_fps: 1.67

jpeg_quality: 80   # cv2-style quality; the GPU path maps it onto nvJPEG's scale
                    # (nvjpegenc quality = jpeg_quality - 15, byte-equivalent)
# GPU JPEG encoders run in parallel by the frame publisher. One shared encoder saturates at ~150 frames/s
# (15 cameras x 10 fps with every tile on the live page); three give it room. 1 = the old single encoder.
jpeg_encoders: 3
stream_maxlen: 500
conf_threshold: 0.0
rtsp_reconnect_interval: 10
# Pre-merge behaviour, pinned (these keys arrived with mr/fire-smoke-attendance,
# whose defaults differ): 800ms jitterbuffer without drop-on-latency (the values
# the sidecar used to hardcode -- dropping one RTP packet corrupts the GOP behind
# the go2rtc relay), and nvstreammux attach-sys-ts=true (rtcp_camera_clock off).
rtsp_latency_ms: 800
rtsp_drop_on_latency: false
rtcp_camera_clock: false
relevant_classes:
  - vehicle
  - license_plate
  - plate
  - car
  - truck
  - bus
  - motorcycle
  - bicycle
  - person
  - traffic light
  - stop sign
  - dog

# minio_access_key / minio_secret_key: set via MINIO_ACCESS_KEY / MINIO_SECRET_KEY env vars

# Zones (intrusion, overcrowding, filter zones): the `zones` module, whose settings all have defaults.
# Takes effect on the next sidecar restart; zone edits themselves hot-reload (iris:ctrl:zones_version).
# Order matters: the box stabilizer runs before the filter zones, so stabilizing sees every box and the filter only
# the stabilized ones.
modules:
  box_stabilizer:            # containment + canonical hold for the pgie's objects, mirroring the offline annotator
    labels: ["vehicle"]
    containment_ratio: 0.85  # drop any box whose area is >= ratio inside another same-label box
    hold_seconds: 0.75       # virtual-hold window for a missing canonical box (15 frames @20fps in the annotator)
  zones: {}

  # Licence-plate detection (secondary GIE on each vehicle crop from the pgie). Every plate comes with the vehicle it was
  # found on; one plate per vehicle: the one nearest the bottom-centre of its box. The best plate per vehicle is kept on its
  # global id by the mtmc module below, saved to plates.dir/<global id>.jpg and announced on iris:mtmc:plates.
  plates:
    config: "/workspace/iris/perception/models/DeepStream-Yolo/config_sgie_plate.txt"
    engine: "/workspace/iris/products/el-mohandes/models/plate_640/best.onnx_b16_gpu0_fp16.engine"
    confidence_threshold: 0.3
    # A plate box smaller than this (pixels of the 1280x720 mux frame) or with a width/height ratio outside the range is
    # dropped before it is chosen, drawn or read: it cannot be read, and the reader makes characters up from it.
    min_width_px: 28
    min_height_px: 12
    min_aspect: 1.0
    max_aspect: 6.0

  # Multi-Target Multi-Camera (MTMC) Vehicle Tracking and plate reading.
  # Multi-Target Multi-Camera (MTMC) Vehicle Tracking.
  # Assigns a stable cross-camera global_id to each tracked vehicle using Re-ID
  # embeddings (torchvision ResNet50 / visual crops) and persistent cross-camera
  # vehicle association.  ResNet50 acts as BOTH a coarse gate (reject obviously-
  # different vehicles below reid_gate_threshold, near-zero false negatives) and
  # the fine matcher (merge above reid_sim_threshold).  The global_id is published
  # to iris:meta:<id> and rendered on the annotated JPEG stream so the operator
  # can visually follow a vehicle across cameras.
  mtmc:
    config:
      iou_threshold: 0.20           # frame-to-frame IoU for per-camera IoU tracker (permissive matching)
      max_unmatched_frames: 500     # match DeepStream's maxShadowTrackingAge (500 frames = ~20s).
                                   # Must be >= tracker shadow age or MTMC expires tracks
                                   # while DeepStream still holds them, causing ID reassignment.
      min_tracklet_frames: 2        # start tracking & publishing global identity on 2nd frame
      min_crop_side_px: 90          # a vehicle crop shorter than this on its shorter side, or with less area than
      min_crop_area_px: 12000       # this, is not used for Re-ID / VLM / gallery; seen only that small = no global id yet
      reid_enabled: true            # load and use the Re-ID model (torchvision ResNet50)
      reid_checkpoint: ""           # (unused) legacy fast-reid .pth path, kept for back-compat
      reid_config: ""               # (unused) legacy fast-reid config, kept for back-compat
      reid_embed_stride: 3          # crop sampling stride within a tracklet (1 = use all)
      reid_max_crops: 16            # cap crops per tracklet per embed pass
      reid_batch_size: 32
      reid_min_crops: 6             # embed a tracklet once it has this many crops (async; or at expiry)
      tracked_classes: ["vehicle"]
      reid_gate_threshold: 0.15     # BELOW this = completely different vehicle -> reject (near-0 FN, no false-merge risk)
      reid_sim_threshold: 0.35      # ABOVE this (and >= gate) = match -> merge into existing global track; between gate & match = ambiguous, keep separate
      time_tolerance_s: 2.0         # max gap for synchronous overlap
      min_disappearance_s: 2.0      # fallback minimum travel time; every allowed pair has its own (group_links)
      # With vlm_arbiter enabled, the layout below (groups + links) is ONLY an eligibility
      # filter (which camera may follow which, and the min/max travel time). They never
      # decide a merge: the VLM judges every eligible track, no FIFO/closest-wins rule and
      # no re-id threshold veto. Re-id similarity just ranks which candidates get asked first.
      vlm_max_candidates: 3         # max eligible tracks sent to the VLM per new tracklet (bounds API calls)
      same_camera_regain_s: 45.0    # the camera's tracker may lose a vehicle (people walking in front) and re-find it under a new id: the VLM may re-join them
      entrance_absence_exit_s: 300.0   # seen only at the entrance, then out of sight of every camera for 5 min and back at an entrance: the earlier visit is complete, the return starts a new one
      # The VLM tells entering from leaving by which end of the vehicle faces the camera. D16 (cam-02) looks at the
      # cab of vehicles that are LEAVING (front = leaving, rear = entering); D41 (cam-01) looks at vehicles from the SIDE: the
      # VLM says which way the front points (left = entering, right = leaving) and the vehicle's own movement must agree
      # (right to left = entering, left to right = leaving). A leaving vehicle is matched to one inside and its visit is closed, like a
      # gate-line exit. A track STARTS only for a vehicle decided as entering (direction_require): an unclear
      # (side/top view, unsure) or unanswered vehicle is asked again every direction_retry_s with its newest crops until
      # direction_wait_s, and if it is still not decided it does not start a track.
      direction_cameras: {cam-01: side_right_to_left_enters, cam-02: front_is_exit}
      direction_views: 3                # crops of the vehicle sent for the question
      direction_min_confidence: 0.7     # below this the answer is ignored
      direction_wait_s: 40.0            # a new vehicle there waits at most this long (video s) for a decided direction
      direction_retry_s: 5.0            # an unclear answer is asked again after this many seconds, with the newest crops
      direction_require: true           # only a vehicle decided as entering starts a track
      origin_cameras: ["cam-01", "cam-02"]    # the entrance group (D41, D16): only vehicles first seen there start a track; other cameras only join an existing one
      vlm_history_views: 1          # crops sent from EACH earlier camera the candidate passed through (its last camera sends vlm_views)
      vlm_collect_max_s: 3.0        # wait up to this long for vlm_views crops of a new vehicle (time-spread) before asking the VLM
      vlm_views: 3                  # crops per vehicle sent to the VLM together, spread over its time on camera (1 = single best crop)
      max_inactive_ttl_s: 0         # 0 = never forget an unseen vehicle: it stays inside until it is seen leaving at the entrance cameras
      associate_interval_s: 1.0     # run cross-camera association every N seconds
      min_embed_frames: 3           # tracklet must have this many embeddings before merge
      # The layout, as groups of cameras that see the same area (overlapping fields of view) and links
      # between neighbouring groups (minimum seconds a vehicle needs to get from one to the other). Links
      # work both ways: vehicles go in and come back out the same way. Groups that are not linked are not
      # adjacent, so no vehicle goes straight between them; inside a group any camera may follow any other
      # with no travel time. D41/D16 --5s-- D52 --3s-- six CH cameras --2s-- D15/D18 --2s-- D28/D31/D05/D20.
      camera_groups:        # cameras that see the same area (overlapping fields of view)
        gate:  ["cam-01", "cam-02"]                                          # D41, D16
        weigh: ["cam-03"]                                                    # D52
        yard:  ["cam-04", "cam-05", "cam-06", "cam-07", "cam-08", "cam-09"]  # CH13 CH22 CH23 CH06 CH30 CH24
        store: ["cam-10", "cam-11"]                                          # D15, D18
        back:  ["cam-12", "cam-13", "cam-14", "cam-15"]                      # D31, D28, D05, D20
      group_links:          # [group, group, minimum seconds between them]; neighbours, both ways
        - [gate, weigh, 3.0]
        - [weigh, yard, 3.0]
        - [yard, store, 2.0]
        - [store, back, 2.0]

      # Only cameras of the same group overlap: an ACTIVE track seen on one may be the vehicle a neighbour in
      # the same group has just picked up, within this many seconds. Across groups it never applies.
      overlap_tolerance_s: 5.0

    # VLM arbiter: validates EVERY proposed cross-camera association (topology-only,
    # high-confidence re-id, and the ambiguous gate<=sim<match zone) on the vehicles'
    # actual crops before mtmc._associate.py is allowed to merge them. Keeps camera
    # topology as one useful signal (still gates which candidates are even
    # considered) rather than the sole source of truth for a merge decision --
    # full-vehicle ReID similarity is a much weaker signal than plate-text matching
    # was, so the VLM is the real arbiter now, not just an ambiguous-zone tiebreak.
    vlm_arbiter:
      enabled: true
      # Hosted Qwen (OpenAI-compatible, DashScope). Key/base URL/model come from the
      # environment (.env -> QWEN_API_KEY / QWEN_BASE_URL / QWEN_MODEL), never from here.
      # To go back to a local/remote Ollama host: provider: "ollama" + host below.
      provider: "openai"
      api_key_env: "QWEN_API_KEY"
      base_url_env: "QWEN_BASE_URL"
      model_env: "QWEN_MODEL"
      host: "http://10.2.0.60:11434"   # only used when provider: "ollama"
      model: "qwen3-vl:4b"             # fallback when QWEN_MODEL is unset / provider: "ollama"
      num_ctx: 8192
      temperature: 0.0
      keep_alive: -1
      min_confidence: 0.5
      # Root cause of the earlier 230-300s+ latency (traced 2026-09-28): under
      # temperature=0.0 greedy decoding, the model would occasionally emit a
      # correct verdict in the first few tokens, then fall into a verbatim
      # repetition loop until it hit num_ctx. num_predict below is the hard stop
      # on tokens -- an isolated 10-pair benchmark showed mean ~4s / max ~4.3s.
      # BUT under live pipeline load (same day) two calls still took 318s and
      # 814s: num_predict bounds token COUNT, not wall-clock time, and this
      # shared host's real contention (colleagues' GPU jobs) can crater decode
      # speed by 100x+. With worker_threads=1 a single such call blocked the
      # ENTIRE arbitration queue for its whole duration. request_timeout_s is
      # the actual fix for that: a hard client-side abort on the HTTP call so
      # one contended call can't stall every other pending comparison -- the
      # abandoned request may keep running server-side, but this worker moves on.
      num_predict: 400            # hard cap on generated tokens -- caps the common case, not the worst case (see above)
      request_timeout_s: 30.0     # hard cap on wall-clock time per HTTP call; frees the worker on a contended/stuck request
      max_wait_s: 60.0             # how long a candidate can go without a global_id while waiting on a verdict
      worker_threads: 4            # hosted API serves calls in parallel (one job per eligible candidate). Ollama host: use 1 -- it doesn't parallelise (confirmed): more
                                    # workers only adds queuing, not throughput, and risks one job's failure-
                                    # triggered model unload aborting a sibling's in-flight generation
      shrink_steps: [1024, 896, 768, 640]
      use_format: false           # true = force Ollama's JSON grammar (format=schema) instead of prompt-only JSON
      log_dir: "data/vlm_arbitration"  # every resolved job's 2 crops + full verdict/context
                                       # appended to log_dir/arbitration_log.jsonl -- for diagnosing
                                       # "why didn't this merge?" without re-running the pipeline

    # Plate reading: the fine-tuned Arabic OCR (exported with mtmc/export_plate_ocr_onnx.py). Every camera's best plate of a
    # vehicle is read; data/plates/<global id>.png shows each camera's crop beside its text.
    plates:
      dir: "/workspace/iris/data/plates"
      ocr_model: "/workspace/iris/products/el-mohandes/models/v5_arabic_mobile-fine-tuned/inference/plate_rec.onnx"
      ocr_dict: "/workspace/iris/products/el-mohandes/models/v5_arabic_mobile-fine-tuned/plate_dict.txt"
      # Enlarge each crop 3x (bicubic) and sharpen it when it is already sharp, as in the OCR's fine-tuning
      # (products/el-mohandes/models/v5_arabic_mobile-fine-tuned/plate_enhancement.py); the saved crop stays the original.
      ocr_enhance: true
      # Keep every crop handed to the reader, exactly as it was (lossless PNG, before the enhancement above), with what
      # was read, in data/plates/crops/ (+ index.jsonl): the input of scripts/plate_enhance_lab.py. Never cleared.
      save_crops: true
      min_width_px: 28      # same limits as the plates module: a smaller crop is never read
      min_height_px: 12

# The shared file sets the mux batch window to 500 ms for attendance's cross-stream tile
# tests. 0 here means "use the pipeline's computed default" (a quarter of the analysis
# period, or 40 ms uncapped), which is what this product has always run with.
mux_push_timeout_us: 0

# The shared pipeline restarts a source after 15 s without a frame at the mux; this product's
# 15-stream RTSP-replay runs have always used 60 s, and clock-drift tracking is opt-in there.
source_stall_seconds: 60
clock_drift_tracking: true

# Long labels (vehicle id + gid + plate) need a bigger preview font than the shared default.
preview_label_scale: 0.8
preview_label_thickness: 2

# Stall forensics: the flight recorder's gdb dump is switched off in the scale runs.
flight_native_dump: false
