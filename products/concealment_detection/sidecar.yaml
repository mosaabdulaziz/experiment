# Concealment detection -- sidecar overlay.
# Inherits mechanism from perception/pipeline/sidecar.yaml; declares this product's cameras,
# role, higher meta sampling rate (25 Hz), SVR disabled (`recorder: none`), and interval=1 pose SGIE.
extends: ../../perception/pipeline/sidecar.yaml

# The model manifest this deployment's model files are checked against at startup (perception/engine/model_manifest.py;
# generated by `python -m mtmc.tracking.manifest generate`).
model_manifest: products/concealment_detection/models.manifest.json

sidecar_role: concealment_detection

sources:
  - {id: cam-1, uri: "rtsp://go2rtc:8554/raw-cam-1", roles: [concealment_detection]}

sample_fps: 25
recorder: none
record_enabled: false

relevant_classes:
  - person
  - handbag
  - backpack
  - suitcase

modules:
  pose:
    config: /workspace/iris/products/concealment_detection/config_sgie_pose.txt
    interval: 1
    model: yolo26x-pose
    detection_threshold: 0.25
    keypoint_confidence_threshold: 0.30
    min_keypoints: 6
    publish_detection_boxes: true
