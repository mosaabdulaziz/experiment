[project]
name = "concealment-detection-service"
version = "0.1.0"
description = "Pose-based suspected concealment review backend for IRIS"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "fastapi>=0.115",
    "pydantic>=2.0",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "../.."]
testpaths = ["tests"]
