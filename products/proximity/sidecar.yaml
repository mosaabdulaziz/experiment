# Pedestrian-vehicle proximity -- sidecar overlay for the yard, warehouse and loading-bay cameras of the multicam sites.
# A safety alert when a person stays too close to a moving vehicle inside a zone with proximity on
# (perception/modules/proximity). Design and measurements: RESEARCH_pedestrian-vehicle-proximity_2026-10-26.md.
# Models first, then the `deepstream-sidecar-proximity` compose service (profile `proximity`):
#   just proximity-models
#   docker compose --profile proximity up -d redis minio go2rtc deepstream-sidecar-proximity
# Extends the shared file, not products/multicam: that one's modules (MTMC, plates) would be deep-merged in.
extends: ../../perception/pipeline/sidecar.yaml

# The model manifest this deployment's model files are checked against at startup (perception/engine/model_manifest.py;
# generated by `python -m mtmc.tracking.manifest generate`). Until it is generated and committed, a missing file only
# warns, unless MODEL_MANIFEST_REQUIRED=1.
model_manifest: products/proximity/models.manifest.json

# In-scope cameras (D01, D11, D20, D21 are out of scope). The same ids as products/multicam, so one set of zones drawn
# in the zone editor serves both. CH05 and D09 are in scope too but have no simulated stream yet.
sources:
  - {id: cam-01, uri: "rtsp://go2rtc:8554/raw-cam-1"}    # D41
  - {id: cam-02, uri: "rtsp://go2rtc:8554/raw-cam-2"}    # D16
  - {id: cam-03, uri: "rtsp://go2rtc:8554/raw-cam-3"}    # D52
  - {id: cam-06, uri: "rtsp://go2rtc:8554/raw-cam-6"}    # CH23
  - {id: cam-10, uri: "rtsp://go2rtc:8554/raw-cam-10"}   # D15
  - {id: cam-11, uri: "rtsp://go2rtc:8554/raw-cam-11"}   # D18
  - {id: cam-14, uri: "rtsp://go2rtc:8554/raw-cam-14"}   # D05 (Camera189)

# YOLO26l-seg COCO at 1280x736: persons, vehicles and masks in one model (RESEARCH 4.1: +7 % persons and +5 % vehicles
# over YOLO11x at 1280; forklifts come through as truck/car). YOLO26x-seg is the per-camera upgrade at 2.2x the GPU.
pgie_config: "/workspace/iris/perception/models/DeepStream-Yolo-Seg/config_infer_primary_yolo26l_seg_1280.txt"
relevant_classes: [person, car, truck, bus, motorcycle]
tracker_config: "perception/pipeline/config_tracker_nvdcf_proximity.yml"

mux_width: 1280
mux_height: 720
capture_width: 1280
capture_height: 720

# The detector on every 3rd frame, ~6.7 analysed frames/s on these 20 fps cameras: enough for the 1 s persistence and
# the 2 s stationary window. The engine sets nvinfer's interval = round(stream_fps / process_fps) = 2, and interval is
# the number of frames nvinfer SKIPS, so it runs on 1 frame in 3 (the module follows nvinfer's own per-frame flag).
# Cost: products/proximity/README.md.
stream_fps: 5
# The recorder's clock correction (segment times -> the pipeline's frame times) re-measured as the run goes: frozen at
# its first measurement it can be seconds off for the whole run (taken during start-up), and alert clips place the
# distance lines and boxes by it (app/overlay_track.py).
clock_drift_tracking: true
# nvstreammux stamps each frame's arrival on this machine's clock (attach-sys-ts), which that correction pairs with
# the frame's pts (the probe's own time would add the inference delay); this product has no use for a camera's RTCP
# clock.
rtcp_camera_clock: false
process_fps: 2.5
sample_fps: 5
conf_threshold: 0.0
pipeline_preview: true          # the module draws its distance lines into the preview
viewer_gated_preview: true
rtcp_camera_clock: false        # go2rtc's relay drops the camera clock

modules:
  proximity:
    depth_model: "/workspace/iris/perception/models/depth/yolo26m-depth-736x1280.onnx"
    # Each camera's person-scale map learned from an hour of its footage: a fresh deployment starts with it instead of
    # learning from nothing (a map saved in Redis wins). Re-learn after a camera is re-aimed.
    scale_seed: "products/proximity/scale_seed.json"
