# Prometheus config of the scale run (docker-compose.scale-monitoring.yml).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "iris-sidecar"          # per-stage telemetry, gauges and counters of the pipeline
    static_configs:
      - targets: ["deepstream-sidecar:9100"]
  - job_name: "iris-exporter"         # GPU engines (NVML), containers, Redis, go2rtc, players, disk, platform
    static_configs:
      - targets: ["iris-exporter:9200"]
  - job_name: "iris-app"              # the camera system's API
    metrics_path: /metrics
    static_configs:
      - targets: ["iris:8000"]
  - job_name: "node"                  # the host: CPU, memory, disk, network
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
