# Ships every container's log of this compose project to Loki, with the level pulled out.
server:
  http_listen_port: 9080
positions:
  filename: /positions/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=scale"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      - regex:
          expression: '^(?:\S+\s+)?\[(?P<level>INFO|WARNING|ERROR|CRITICAL|DEBUG)\]'
      - labels:
          level:
