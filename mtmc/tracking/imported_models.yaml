# Models the products load that were NOT trained by a tracked run in this repo, imported into MLflow by
# `python -m mtmc.tracking.import_models` (sub-task 3 of the MLflow story; spike D2, Q3, Q4, Q5, Q7).
#
# The import creates one run per entry (experiment `imported-models`) with the provenance below, the params and
# metrics of any existing record, the record files as artifacts, and the model files via log_model_file (which
# writes <file>.mlflow.json beside each). It does NOT register models: registration of trained and imported models
# alike is the registry sub-task's job.
#
# Metric steps are 0-based epochs (run tag import.step_base=0): results.csv and the Kaggle training-report.md number
# epochs from 1, but Ultralytics' MLflow callback logs step = trainer.epoch (0-based), so the import logs epoch N at
# step N-1 and imported runs line up with newly trained ones.
#
# Every value here comes from a file in this repo, cited in `evidence`. Nothing is filled in from memory:
#   provenance: unknown        -> no record of where the file came from
#   gaps: [...]                -> what is missing from an otherwise known provenance
#
# Fields:
#   id                 stable entry id (run name, tag import.catalog_entry)
#   capability         the registered model name it will become a version of (D2)
#   source             imported | kaggle
#   files              the model file first (its sha256 makes the import key), then companions the runtime loads
#                      with it (labels, metadata the runtime reads); each is logged with log_model_file
#   expected_sha256    pins this repo already records for these files; a mismatch skips the entry
#   records            existing training/eval records: parsed into params/metrics and logged as artifacts
#                      kinds: ultralytics_args, ultralytics_results, paddle_config, ocr_training_report, staff_json
#   artifacts          other record files, logged as artifacts only
#   data               datasets it was trained on, by .dvc pointer (data.<name>.dvc_md5 tags)
#   provenance         origin and how the file was produced, or `unknown`
#   evidence           where in the repo the provenance comes from

